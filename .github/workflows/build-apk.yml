name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android

          # 1. Decode from base64 if present
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          # 2. If debug.keystore is still missing or empty, generate a valid debug keystore
          if [ ! -s debug.keystore ]; then
            echo "Generating fresh debug.keystore with keytool..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Ensure it is also available in ~/.android
          cp debug.keystore ~/.android/debug.keystore

          echo "Debug keystore ready at $(pwd)/debug.keystore (size: $(wc -c < debug.keystore) bytes)"

      - name: Ensure google-services.json Exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "Creating fallback google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "123456789000", "project_id": "dietgrocerytracker-app", "storage_bucket": "dietgrocerytracker-app.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:123456789000:android:0123456789abcdef", "android_client_info": { "package_name": "com.aistudio.dietgrocerytracker.qpxvwm" } }, "oauth_client": [], "api_key": [{ "current_key": "dummy_key" }], "services": { "analytics_service": { "status": 1 } } }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon -Djava.awt.headless=true

      - name: Verify APK Generation
        run: |
          echo "=== Checking Output Directory ==="
          ls -la app/build/outputs/apk/debug/
          echo "=== Found APK ==="
          ls -lh app/build/outputs/apk/debug/*.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PantryBurn.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PantryBurn-Debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/PantryBurn.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PantryBurn v1.0.${{ github.run_number }}
          body: |
            ### 🛒 PantryBurn Android App (Build #${{ github.run_number }})
            New APK build automatically generated from commit `${{ github.sha }}`.

            #### 📲 Download and Install:
            - Click **`PantryBurn.apk`** below under **Assets** to download directly to your phone.
            - Tap the downloaded APK to install.
          files: |
            app/build/outputs/apk/debug/PantryBurn.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

